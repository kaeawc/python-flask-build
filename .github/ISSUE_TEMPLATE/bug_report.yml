name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Commands, requests or configuration that trigger it.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or image tag
      placeholder: e.g. 189daa1 or ghcr.io/kaeawc/python-build:sha-...
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output. Remove anything secret.
      render: text
