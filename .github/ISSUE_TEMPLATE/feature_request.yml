name: Feature request
description: Suggest a tool, practice or capability for the template.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would add or change, and any alternatives you considered.
    validations:
      required: true
