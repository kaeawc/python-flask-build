name: "Commit"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main

permissions:
  checks: write
  contents: read
  packages: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v4

      - uses: ./.github/actions/run-with-uv
        with:
          run-tasks: "tox"

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v4

      - uses: ./.github/actions/run-with-uv
        with:
          run-tasks: "tox -e lint"

  format:
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v4

      - uses: ./.github/actions/run-with-uv
        with:
          run-tasks: "tox -e format"

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v4

      - uses: ./.github/actions/run-with-uv
        with:
          run-tasks: "tox -e coverage"

      - name: "Archive Coverage Report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: reports/coverage/

  bandit:
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v4

      - uses: ./.github/actions/run-with-uv
        with:
          run-tasks: "tox -e bandit"

      - name: "Archive Bandit Report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: reports/bandit/report.xml

  build-image:
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - lint
      - format
      - coverage
      - bandit
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v4

      - name: "Build Docker image"
        run: docker build -f ci/Dockerfile -t ghcr.io/${{ github.repository_owner }}/python-build:latest .

      - name: "Smoke Test Docker image"
        run: |
          docker run -d --name smoke-test -p 5000:5000 ghcr.io/${{ github.repository_owner }}/python-build:latest
          trap 'docker logs smoke-test; docker rm -f smoke-test' EXIT
          curl --silent --show-error --fail --retry 10 --retry-delay 1 --retry-all-errors http://localhost:5000/status

      - name: "Log in to GitHub Docker registry"
        if: github.secret_source == 'Actions' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      - name: "Push Docker image"
        if: github.secret_source == 'Actions' && github.ref == 'refs/heads/main'
        run: docker push ghcr.io/${{ github.repository_owner }}/python-build:latest